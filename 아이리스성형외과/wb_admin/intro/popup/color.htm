    <script type='text/javascript'>
        var fixed = false;
        var fxd_1 = false;
        var fxd_2 = false;
        var clr_dcml,clr_prcnt;
        function Q_convert_hex_2_color(R_hex,G_hex,B_hex) {
            R_dcml = parseInt('0x'+R_hex,16);
            G_dcml = parseInt('0x'+G_hex,16);
            B_dcml = parseInt('0x'+B_hex,16);
            clr_dcml = 'RGB('+R_dcml+','+G_dcml+','+B_dcml+')';
            R_prcnt = Math.round(100*R_dcml/255);
            G_prcnt = Math.round(100*G_dcml/255);
            B_prcnt = Math.round(100*B_dcml/255);
            clr_prcnt = 'RGB('+R_prcnt+'%,'+G_prcnt+'%,'+B_prcnt+'%)';
        }
        function Q(strng) {
            Q_convert_hex_2_color(strng.substr(1,2),strng.substr(3,2),strng.substr(5,2))
            if(!fixed) {
                document.getElementById('i_dcml').value  = clr_dcml ;
                document.getElementById('i_prcnt').value = clr_prcnt;
                document.getElementById('i_hex').value   = strng  ;
                document.getElementById('i_bg_clr').style.backgroundColor = strng;
            }
        }
        function Q_1(strng) {
            Q_convert_hex_2_color(strng.substr(1,2),strng.substr(3,2),strng.substr(5,2))
            if(!fxd_1) {
                document.getElementById('i_dcml_1').value  = clr_dcml ;
                document.getElementById('i_prcnt_1').value = clr_prcnt;
                document.getElementById('i_hex_1').value   = strng  ;
                document.getElementById('i_bg_clr_1').style.backgroundColor = strng;
            }
        }
        function Q_2(strng) {
            Q_convert_hex_2_color(strng.substr(1,2),strng.substr(3,2),strng.substr(5,2))
            if(!fxd_2) {
                document.getElementById('i_dcml_2').value  = clr_dcml ;
                document.getElementById('i_prcnt_2').value = clr_prcnt;
                document.getElementById('i_hex_2').value   = strng  ;
                document.getElementById('i_bg_clr_2').style.backgroundColor = strng;
            }
        }
    </script>
