function sAll(mode)
{
	var form = document.bbs_list;
	var len = form.elements.length;
	
	for(i=0; i<len; i++)

	}
}

function del()
{
	var form = document.bbs_list;
	var len = form.elements.length;
	var sel_count=0;
	
	for(i=0; i<len; i++)
	{
		if(form.elements[i].checked==true)
			sel_count++;
	}

	if(sel_count <= 0)
	{

	}

	{

		form.submit();
	}
}
