<Script language="javascript">

function checkForm(form)

{

	if(!form.search_word.value)

	{

		alert("검색어를 입력하시길 바랍니다.");

		form.search_word.focus();



		return false;

	}

	

	form.submit();

}



function sAll(mode)

{

	var form = document.forms[0];

	var len = form.elements.length;

	

	for(i=0; i<len; i++)

	{

		form.elements[i].checked=mode;

	}

}



function del()

{

	var form = document.forms[0];

	var len = form.elements.length;

	var sel_count=0;

	

	for(i=0; i<len; i++)

	{

		if(form.elements[i].checked==true)

			sel_count++;

	}



	if(sel_count <= 0)

	{

		alert("선택을 하지 않았습니다.");

	}

	else

	{

		form.action="proc_mbbs_delete.html";

		form.submit();

	}

}

</Script>
