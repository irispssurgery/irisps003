<Script language="javascript">

function checkForm()
{
	var form=document.admin_login;

	if(!form.admin_id.value)
	{
		alert("아이디를 입력하여 주십시요.");
		form.admin_id.focus();
		
		return false;
	}

	if(!form.admin_pwd.value)
	{
		alert("비밀번호를 입력하여 주십시요.");
		form.admin_pwd.focus();

		return false;
	}
}

</Script>
